# =============================================================================
# Grafana admin credentials — fetched from AWS, never committed
#
# This file is the ONLY thing about the Grafana password that exists in git: an
# instruction to go and fetch it. The password itself lives in AWS Secrets
# Manager, put there by Terraform (fraud-infra modules/secrets-manager/main.tf).
# Rotating it means changing it in AWS; ESO notices within refreshInterval. No
# redeploy, no commit.
#
#   AWS Secrets Manager  /fraud/dev/grafana-admin
#   {"admin-user":"admin","admin-password":"..."}
#            │
#            │  ESO authenticates with a ServiceAccount token — a JWT signed by
#            │  the cluster — exchanged at AWS STS for temporary credentials
#            │  for fraud-dev-eso-role. That is IRSA. There is no AWS key
#            │  anywhere in this cluster.
#            ▼
#   Secret  monitoring/grafana-admin   keys: admin-user, admin-password
#            │
#            ▼
#   envs/dev/values-kube-prometheus-stack.yaml
#     grafana.admin.existingSecret: grafana-admin
#     grafana.admin.userKey:        admin-user
#     grafana.admin.passwordKey:    admin-password
#
# The three names above must match this file character for character. They are
# the contract; break one and Grafana silently invents a random password.
#
# WHY THIS SITS IN WAVE -1 (the platform-bootstrap Application)
# -------------------------------------------------------------
# kube-prometheus-stack is wave 1. If Grafana and this ExternalSecret landed
# together, Grafana would SOMETIMES win the race, find no `grafana-admin`
# Secret, generate a random admin password and start up perfectly healthy.
# Nothing errors. Nothing is red. You simply cannot log in, and the reason is
# invisible. The wave turns "usually fine" into "guaranteed".
#
# TWO THINGS THAT WILL BITE (both cost hours before — see
# fraud-infra/docs/TROUBLESHOOTING.md §10)
# -------------------------------------------------------------
# 1. apiVersion is external-secrets.io/v1 — NOT v1beta1. ESO 2.x stopped
#    *serving* v1beta1. The CRD still LISTS it with served: false, so the API
#    server answers "no matches for kind ExternalSecret", which reads like the
#    CRD is missing rather than deprecated. Ask what is served, never what
#    exists:   kubectl api-resources --api-group=external-secrets.io
#
# 2. secretStoreRef.kind is ClusterSecretStore — NOT SecretStore. The store is
#    cluster-scoped so monitoring, mlflow and kafka can all share one IAM role.
#    Omit `kind` and it defaults to the namespaced SecretStore, and ESO reports
#    "SecretStore not found" while the store is plainly visible in
#    `kubectl get clustersecretstore`.
#
# AND A THIRD, IN .gitignore
# -------------------------------------------------------------
# `.gitignore` contains `*-secret.yaml`, which matches this filename. The line
# `!*-externalsecret.yaml` un-ignores it and is LOAD-BEARING. Remove it and the
# failure is silent and green: ArgoCD reports Synced/Healthy, Grafana runs, and
# the password is a random string nobody has. Verify with:
#
#   git ls-files | grep externalsecret
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: fraud-platform
    env: dev
spec:
  # Re-read AWS every hour. A rotated password reaches Grafana within the hour
  # with no deploy. Shorter is tempting, but every ExternalSecret in the
  # cluster is a GetSecretValue call against the same API quota.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager      # created by fraud-infra/scripts/01
    kind: ClusterSecretStore       # NOT SecretStore — see note 2 above

  target:
    # The Kubernetes Secret ESO will create. This name is what
    # grafana.admin.existingSecret points at.
    name: grafana-admin
    # Owner: ESO creates the Secret and owns it, so deleting this
    # ExternalSecret deletes the Secret too. The alternative, Merge, would
    # leave a stale credential behind after the instruction to fetch it was
    # gone — a secret with no declared source.
    creationPolicy: Owner

  # Two keys pulled from the ONE JSON blob in AWS. `property` reaches inside
  # the JSON; without it, secretKey would receive the whole
  # {"admin-user":...,"admin-password":...} document as its value and Grafana
  # would treat that entire string as the password.
  data:
    - secretKey: admin-user
      remoteRef:
        key: /fraud/dev/grafana-admin
        property: admin-user

    - secretKey: admin-password
      remoteRef:
        key: /fraud/dev/grafana-admin
        property: admin-password
