apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: fraud-platform
    env: dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager      # created by fraud-infra/scripts/01
    kind: ClusterSecretStore       # NOT SecretStore — see note 2 above

  target:
    name: grafana-admin
    creationPolicy: Owner

  data:
    - secretKey: admin-user
      remoteRef:
        key: /fraud/dev/grafana-admin
        property: admin-user

    - secretKey: admin-password
      remoteRef:
        key: /fraud/dev/grafana-admin
        property: admin-password
