apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: fraud-kibana
  namespace: logging
  annotations:
    eck.k8s.elastic.co/license: basic
  labels:
    app.kubernetes.io/part-of: fraud-platform
    env: dev

spec:
  version: 9.5.0

  count: 1

  elasticsearchRef:
    name: fraud-elasticsearch
   

  http:
    tls:
      selfSignedCertificate:
        disabled: true

  podTemplate:
    spec:
      
      nodeSelector:
        workload: general

      containers:
        # Name fixed by ECK, same merge-by-name rule as the ES container.
        - name: kibana
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
