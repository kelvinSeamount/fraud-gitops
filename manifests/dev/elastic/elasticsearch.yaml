apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: fraud-elasticsearch
  namespace: logging
  annotations:
    eck.k8s.elastic.co/license: basic
  labels:
    app.kubernetes.io/part-of: fraud-platform
    env: dev

spec:
  version: 9.5.0

  http:
    tls:
      selfSignedCertificate:
        disabled: false

  nodeSets:
    - name: default
      count: 1

      config:
        node.store.allow_mmap: false

      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoreDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: worload
                        operator: In
                        values:
                          - memory

          tolerations:
            - key: workload
              operator: Equal
              value: memory
              effect: NoSchedule

          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms2g -Xmx2g"

              resources:
                requests:
                  cpu: 500m
                  memory: 4Gi
                limits:
                  memory: 4Gi

      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 30Gi
            storageClassName: gp3
