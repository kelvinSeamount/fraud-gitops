fullnameOverride: hello-platform
replicaCount: 2

# ─── THE CONTAINER ──────────────────────────────────────────────────────────
image:
 
  repository: nginxinc/nginx-unprivileged
  # An exact version. Never "latest" — see values.yaml for why.
  tag: 1.29-alpine
  pullPolicy: IfNotPresent

# ─── IDENTITY ───────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  # No annotation, so no AWS access. A web page has no business reaching AWS.
  # Phase 1's scoring service puts its AWS role here.
  annotations: {}

# ─── SECURITY ───────────────────────────────────────────────────────────────
# Overriding the chart defaults, and both overrides are deliberate.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# ─── ADDRESS ────────────────────────────────────────────────────────────────
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080     # what nginx-unprivileged listens on

# ─── HOW MUCH IT MAY USE ────────────────────────────────────────────────────
# Tiny. It serves one page.
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

config:
  files:
    index.html: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>hello-platform</title>
        <style>
          body { font-family: system-ui, sans-serif; background: #0d1117;
                 color: #e6edf3; display: grid; place-items: center;
                 height: 100vh; margin: 0; }
          .card { text-align: center; }
          h1 { font-size: 2rem; margin: 0 0 .5rem; }
          .v { font-size: 3rem; font-weight: 700; color: #58a6ff; }
          p { color: #8b949e; margin: .25rem 0; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>hello-platform</h1>
          <div class="v">v2</div>
          <p>Delivered by ArgoCD from fraud-gitops</p>
          <p>no kubectl was involved</p>
        </div>
      </body>
      </html>

  # Where to put that file. nginx serves whatever lives here.
  filesMountPath: /usr/share/nginx/html

nodeSelector:
  workload: general

serviceMonitor:
  enabled: false

autoscaling:
  enabled: false
