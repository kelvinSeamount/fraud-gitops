apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    env: dev
    app.kubernetes.io/part-of: fraud-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fraud-platform

  sources:
    - repoURL: https://github.com/kelvinSeamount/fraud-gitops.git
      targetRevision: feature/argocd_setup
      ref: values
    - repoURL: https://helm.elastic.co
      chart: eck-operator
      targetRevision: 3.5.0
      helm:
        releaseName: eck-operator
        valueFiles:
          - $values/envs/dev/values-eck-operator.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10

