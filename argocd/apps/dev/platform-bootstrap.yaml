apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-bootstrap
  namespace: argocd
  annotations:
    # Lowest number goes first. Nothing else starts until this is finished.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    env: dev
    app.kubernetes.io/part-of: fraud-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fraud-platform

  source:
    repoURL: https://github.com/kelvinSeamount/fraud-gitops.git
    targetRevision: feature/argocd_setup
    path: manifests/dev/platform-bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
