apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-platform-root-dev
  namespace: argocd
  labels:
    env: dev
    app.kubernetes.io/part-of: fraud-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fraud-platform

  source:
    repoURL: https://github.com/kelvinSeamount/fraud-gitops.git
    targetRevision: feature/argocd_setup
    path: argocd/apps/dev
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true        
      selfHeal: true     
      allowEmpty: false  
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      # If a sync fails, try again — waiting longer each time (15s, 30s, 60s...)
      # rather than hammering a cluster that is already struggling.
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  # Keep the last 10 versions, so rolling back is instant.
  revisionHistoryLimit: 10
